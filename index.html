<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATENTO - Cuestionario Familia</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1000px;
            margin: 0 auto;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1em;
            opacity: 0.95;
        }

        .content {
            padding: 30px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 1.5em;
            color: #f5576c;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f5576c;
        }

        .field-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .field {
            margin-bottom: 15px;
        }

        .field label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .field input[type="text"],
        .field input[type="date"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }

        .radio-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .radio-option {
            display: flex;
            align-items: center;
            padding: 8px 15px;
            border: 2px solid #ddd;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .radio-option:hover {
            border-color: #f5576c;
            background: #fff0f3;
        }

        .radio-option input {
            margin-right: 8px;
        }

        .radio-option.selected {
            border-color: #f5576c;
            background: #f5576c;
            color: white;
        }

        .items-header {
            background: #fff0f3;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #666;
        }

        .item-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px dashed #eee;
        }

        .item-text {
            font-size: 0.95em;
            color: #333;
        }

        .item-number {
            font-weight: bold;
            color: #f5576c;
            margin-right: 8px;
        }

        .likert-scale {
            display: grid;
            grid-template-columns: repeat(5, 50px);
            gap: 10px;
            justify-content: end;
        }

        .likert-option {
            text-align: center;
        }

        .likert-option input {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .likert-option label {
            display: block;
            font-size: 0.75em;
            color: #666;
            margin-top: 4px;
        }

        .btn-container {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: #f5576c;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #e04459;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(245, 87, 108, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-bar {
            background: #e9ecef;
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-fill {
            background: #f5576c;
            height: 100%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            margin-top: 10px;
            color: #666;
            font-size: 0.9em;
        }

        .success-message {
            text-align: center;
            padding: 60px 30px;
        }

        .success-message h2 {
            color: #28a745;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .success-message p {
            color: #666;
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            .likert-scale {
                grid-template-columns: repeat(5, 40px);
                gap: 5px;
            }

            .item-row {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .likert-scale {
                justify-content: start;
            }
        }
    </style>
</head>

        const state = {
            meta: {},

        // ========================================
        // FUNCIONES DE RENDERIZADO
        // ========================================
        function renderApp() {
            const content = document.getElementById('app-content');
            content.innerHTML = '';

            questionnaireData.sections.forEach(section => {
                if (section.id === 'items') {
                    content.appendChild(renderItemsSection(section));
                } else {
                    content.appendChild(renderMetaSection(section));
                }
            });

            content.appendChild(renderProgressBar());
            content.appendChild(renderActions());
        }

        function renderMetaSection(section) {
            const div = document.createElement('div');
            div.className = 'section';

            const title = document.createElement('h2');
            title.className = 'section-title';
            title.textContent = section.title;
            div.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'field-grid';

            section.fields.forEach(field => {
                const fieldDiv = document.createElement('div');
                fieldDiv.className = 'field';

                const label = document.createElement('label');
                label.textContent = field.label;
                fieldDiv.appendChild(label);

                if (field.type === 'radio') {
                    const radioGroup = document.createElement('div');
                    radioGroup.className = 'radio-group';

                    field.options.forEach(option => {
                        const radioDiv = document.createElement('div');
                        radioDiv.className = 'radio-option';
                        
                        const input = document.createElement('input');
                        input.type = 'radio';
                        input.name = field.id;
                        input.value = option;
                        input.id = `${field.id}_${option}`;
                        
                        input.addEventListener('change', () => {
                            state.meta[field.id] = option;
                            updateRadioStyles(field.id);
                        });

                        const optionLabel = document.createElement('label');
                        optionLabel.htmlFor = input.id;
                        optionLabel.textContent = option;

                        radioDiv.appendChild(input);
                        radioDiv.appendChild(optionLabel);
                        radioGroup.appendChild(radioDiv);
                    });

                    fieldDiv.appendChild(radioGroup);
                } else {
                    const input = document.createElement('input');
                    input.type = field.type;
                    input.id = field.id;

                    input.addEventListener('input', () => {
                        state.meta[field.id] = input.value;
                    });

                    fieldDiv.appendChild(input);
                }

                grid.appendChild(fieldDiv);
            });

            div.appendChild(grid);
            return div;
        }

        function renderItemsSection(section) {
            const div = document.createElement('div');
            div.className = 'section';

            const title = document.createElement('h2');
            title.className = 'section-title';
            title.textContent = section.title;
            div.appendChild(title);

            const header = document.createElement('div');
            header.className = 'items-header';
            header.textContent = 'Escala: 1 = Nunca o casi nunca · 2 = Pocas veces · 3 = Algunas veces · 4 = Muchas veces · 5 = Siempre o casi siempre';
            div.appendChild(header);

            section.questions.forEach(question => {
                const row = document.createElement('div');
                row.className = 'item-row';

                const textDiv = document.createElement('div');
                textDiv.className = 'item-text';
                textDiv.innerHTML = `<span class="item-number">${question.id}.</span>${question.text}`;
                row.appendChild(textDiv);

                const scale = document.createElement('div');
                scale.className = 'likert-scale';

                section.response_scale.options.forEach(option => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'likert-option';

                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `q_${question.id}`;
                    input.value = option.value;
                    input.id = `q_${question.id}_${option.value}`;

                    input.addEventListener('change', () => {
                        state.answers[question.id] = option.value;
                        renderApp();
                    });

                    const label = document.createElement('label');
                    label.htmlFor = input.id;
                    label.textContent = option.value;

                    if (state.answers[question.id] === option.value) {
                        input.checked = true;
                    }

                    optionDiv.appendChild(input);
                    optionDiv.appendChild(label);
                    scale.appendChild(optionDiv);
                });

                row.appendChild(scale);
                div.appendChild(row);
            });

            return div;
        }

        function renderProgressBar() {
            const itemsSection = questionnaireData.sections.find(s => s.id === 'items');
            const totalQuestions = itemsSection.questions.length;
            const answeredCount = Object.keys(state.answers).length;
            const percentage = Math.round((answeredCount / totalQuestions) * 100);

            const div = document.createElement('div');
            div.className = 'section';

            const progressBar = document.createElement('div');
            progressBar.className = 'progress-bar';

            const progressFill = document.createElement('div');
            progressFill.className = 'progress-fill';
            progressFill.style.width = `${percentage}%`;
            progressBar.appendChild(progressFill);

            const progressText = document.createElement('div');
            progressText.className = 'progress-text';
            progressText.textContent = `Progreso: ${answeredCount} / ${totalQuestions} preguntas (${percentage}%)`;

            div.appendChild(progressBar);
            div.appendChild(progressText);

            return div;
        }
        
        function doAutofill() {
            const hoy = new Date().toISOString().slice(0, 10);
            state.meta = {
                nombre_id: 'DEMO-Autofill',
                edad: '5',
                sexo: 'Niño',
                fecha_evaluacion: hoy,
                centro_escuela: 'Centro Demo',
                curso_etapa: 'Infantil 5 años',
                nombre_respondedor: 'Docente Demo',
                relacion: 'Profesor/a',
                meses_conoce: '10',
                grado_conocimiento: '8'
            };
            const itemsSection = questionnaireData.sections.find(s => s.id === 'items');
            itemsSection.questions.forEach(q => {
                state.answers[q.id] = Math.floor(Math.random() * 5) + 1;
            });
            renderApp();
        }

        function renderActions() {
            const div = document.createElement('div');
            div.className = 'btn-container';

            const itemsSection = questionnaireData.sections.find(s => s.id === 'items');
            const missingItems = itemsSection.questions
                .map(q => q.id)
                .filter(id => state.answers[id] == null);
            const btnAutofill = document.createElement('button');
            btnAutofill.type = 'button';
            btnAutofill.className = 'btn btn-secondary';
            btnAutofill.textContent = 'Autofill (demo)';
            btnAutofill.addEventListener('click', () => {
                if (confirm('¿Rellenar todo el cuestionario con datos de prueba?')) {
                    doAutofill();
                }
            });
            div.appendChild(btnAutofill);

            const btnCheck = document.createElement('button');
            btnCheck.className = 'btn btn-secondary';
            btnCheck.textContent = 'Comprobar faltantes';
            btnCheck.addEventListener('click', () => {
                if (missingItems.length === 0) {
                    alert('✅ Todas las preguntas han sido respondidas!');
                } else {
                    alert(`Faltan ${missingItems.length} preguntas: ${missingItems.join(', ')}`);
                }
            });
            

            const btnSubmit = document.createElement('button');
            btnSubmit.className = 'btn btn-primary';
            btnSubmit.textContent = 'Enviar Cuestionario';
            btnSubmit.disabled = missingItems.length > 0;
            btnSubmit.addEventListener('click', handleSubmit);

            div.appendChild(btnCheck);
            div.appendChild(btnSubmit);

            return div;
        }
        

        function updateRadioStyles(fieldId) {
            const radioOptions = document.querySelectorAll(`input[name="${fieldId}"]`);
            radioOptions.forEach(radio => {
                const parent = radio.parentElement;
                if (radio.checked) {
                    parent.classList.add('selected');
                } else {
                    parent.classList.remove('selected');
                }
            });
        }

        // ========================================
        // ENVÍO A GOOGLE SHEETS
        // ========================================
          function handleSubmit() {
            if (!GOOGLE_SHEETS_URL || !GOOGLE_SHEETS_URL.includes('/macros/s/') || !GOOGLE_SHEETS_URL.endsWith('/exec')) {
                alert('⚠️ Por favor, configura la URL de Google Apps Script en el código.');
                return;
            }

            const btn = event.target;
            btn.disabled = true;
            btn.textContent = 'Enviando...';

            const payload = {
                instrument: questionnaireData.instrument,
                timestamp: new Date().toISOString(),
                meta: state.meta,
                answers: state.answers
            };

            console.log('[ATENTO Familia] Enviando payload:', payload);

            const form = document.createElement('form');
            form.method = 'POST';
            form.action = GOOGLE_SHEETS_URL;
            form.target = 'atento-familia-iframe';
            form.style.display = 'none';

            const input = document.createElement('input');
            input.name = 'payload';
            input.value = JSON.stringify(payload);
            form.appendChild(input);

            document.body.appendChild(form);
            form.submit();
            form.remove();

            const timeout = setTimeout(() => {
                console.log('[ATENTO Familia] Asumiendo éxito tras 10 segundos');
                showSuccess();
            }, 10000);

            window.addEventListener('message', function onMessage(e) {
                if (e.data && e.data.type === 'EMOOTI_SUBMIT_SUCCESS') {
                    clearTimeout(timeout);
                    window.removeEventListener('message', onMessage);
                    showSuccess();
                } else if (e.data && e.data.type === 'EMOOTI_SUBMIT_ERROR') {
                    clearTimeout(timeout);
                    window.removeEventListener('message', onMessage);
                    alert('Error al enviar: ' + (e.data.message || 'Error desconocido'));
                    btn.disabled = false;
                    btn.textContent = 'Enviar Cuestionario';
                }
            });
        }

        function showSuccess() {
            const content = document.getElementById('app-content');
            content.innerHTML = `
                <div class="success-message">
                    <h2>✅ Cuestionario enviado correctamente</h2>
                    <p>Los resultados han sido guardados en Google Sheets.</p>
                    <p style="margin-top: 20px;"><a href="#" onclick="location.reload()">Completar otro cuestionario</a></p>
                </div>
            `;
        }

        // ========================================
        // INICIALIZACIÓN
        // ========================================
        window.addEventListener('DOMContentLoaded', () => {
            console.log('[ATENTO Familia] Iniciando cuestionario');
            renderApp();
        });

    })();
    </script>
</body>
</html>
